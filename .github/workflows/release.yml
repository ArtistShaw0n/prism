name: Release

# Pushing a v* tag builds, signs and publishes the release that installed
# copies of Prism will auto-update from.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 14+ runners are Apple Silicon; both targets are added explicitly
    # below so the bundle is universal.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism ${{ github.ref_name }}'
          releaseBody: |
            Download `Prism_universal.dmg`, drag it to Applications.

            Prism is not notarised with an Apple Developer ID, so the first
            launch needs **right-click → Open** (or `xattr -cr /Applications/Prism.app`).
            Later updates install silently.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          # Produces latest.json, which the updater endpoint points at.
          includeUpdaterJson: true
